<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train Bogie Frame Verification</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

    <style>
      :root { --client-blue: #214390; }

      body { background: #f6f8fc; }

      .precheck-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .precheck-header {
        background: var(--client-blue);
        color: #fff;
        height: 110px;
        display: flex;
        align-items: center;
        padding: 0 28px;
        gap: 22px;
      }
      .precheck-header .logo-wrap {
        width: 76px;
        height: 76px;
        background: #fff;
        border-radius: 8px;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .precheck-header img {
        width: 76px;
        height: 76px;
        object-fit: contain;
      }
      .precheck-header h1 {
        font-size: 44px;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.5px;
      }

      /* Main layout */
      .precheck-content {
        flex: 1;
        padding: 24px 28px 30px;
      }
      .precheck-grid {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 18px;
        align-items: start;
      }

      /* Panels */
      .panel {
        background: #fff;
        border: 3px solid var(--client-blue);
        border-radius: 4px;
        overflow: hidden;
      }
      .panel-body {
        padding: 14px;
      }

      .live-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        display: grid;
        place-items: center;
      }
      .live-frame img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .class-bar {
        background: var(--client-blue);
        color: #fff;
        padding: 14px 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 18px;
      }

      /* Right side upload panel */
      .upload-head {
        background: #d9d9d9;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 3px solid var(--client-blue);
      }
      .upload-head .title {
        font-weight: 700;
        font-size: 20px;
        color: #111;
      }
      .upload-head .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn {
        border: 2px solid var(--client-blue);
        background: #fff;
        color: var(--client-blue);
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 16px;
      }
      .btn.primary {
        background: var(--client-blue);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .upload-preview {
        width: 100%;
        aspect-ratio: 16 / 10;
        background: #000;
        display: grid;
        place-items: center;
      }
      .upload-preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .upload-footer {
        padding: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .hint-row {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
      }

      /* Responsive */
      @media (max-width: 1050px) {
        .precheck-header h1 { font-size: 32px; }
        .precheck-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>

  <body>
    <div class="precheck-page">
      <!-- Header -->
      <header class="precheck-header">
        <div class="logo-wrap">
          <img src="{{ url_for('static', filename='images/lrmc_logo.png') }}" alt="Client Logo" />
        </div>
        <h1>Train Bogie Frame Verification</h1>
      </header>

      <!-- Body -->
      <main class="precheck-content">
        <div class="precheck-grid">
          <!-- LEFT: Live camera -->
          <section class="panel">
            <div class="live-frame">
              <!-- USB precheck feed -->
              <img id="liveFeed" src="/usb_video_feed" alt="Live Camera Feed" />
            </div>
            <!-- No "Status" label, just classification text -->
            <div class="class-bar" id="liveClassText">Initializing...</div>
          </section>

          <!-- RIGHT: Image verification -->
          <section class="panel">
            <div class="upload-head">
              <div class="title">Image Verification</div>
              <div class="controls">
                <input id="verifyFile" type="file" accept="image/*" />
                <button id="verifyBtn" class="btn" type="button">Verify</button>
              </div>
            </div>

            <div class="panel-body">
              <div class="upload-preview">
                <img id="uploadPreviewImg" src="#" alt="Sample Image" style="display:none;" />
                <div id="uploadPlaceholder" style="color:#ffeb3b;font-size:26px;font-weight:700;">
                  Sample Image
                </div>
              </div>

              <!-- No "Status" label, just classification text -->
              <div class="class-bar" id="uploadClassText">Upload an image to verify.</div>

              <div class="upload-footer">
                <button id="refreshBtn" class="btn" type="button">Refresh</button>
                <button id="continueBtn" class="btn primary" type="button" disabled>Continue</button>
              </div>

              <div class="hint-row">
                Note: Upload verification does not auto-continue. Press <b>Continue</b> to proceed.
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/precheck.js') }}"></script>
  </body>
</html>
